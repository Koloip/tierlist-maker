<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tier List Maker</title>
<meta name="description" content="Free, offline tier list maker with no image limit, plus a pairwise comparison mode. Your images never leave your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect y='1' width='32' height='9' rx='2' fill='%23ff7f7f'/%3E%3Crect y='12' width='24' height='9' rx='2' fill='%23ffdf7f'/%3E%3Crect y='23' width='16' height='9' rx='2' fill='%23bfff7f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#252525">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

<header>
  <div class="proj">
    <div class="menu-wrap">
      <button class="btn icon-btn" id="menuBtn" data-i18n-title="menu">☰</button>
      <div class="menu" id="menu" hidden>
        <button data-act="newProj" data-i18n="proj_new"></button>
        <button data-act="renameProj" data-i18n="proj_rename"></button>
        <button data-act="deleteProj" data-i18n="proj_delete"></button>
        <hr>
        <button data-act="exportProj" data-i18n="exp"></button>
        <button data-act="importProj" data-i18n="imp"></button>
        <hr id="installSep">
        <button data-act="install" id="installItem" data-i18n="install" hidden></button>
      </div>
    </div>
    <select id="project"></select>
    <input type="file" id="fImport" accept=".json,application/json" hidden>
  </div>
  <div class="tabs">
    <button class="tab" data-view="tier" data-i18n="tab_tier"></button>
    <button class="tab" data-view="cmp" data-i18n="tab_cmp"></button>
    <button class="tab" data-view="res" data-i18n="tab_res"></button>
    <button class="tab" data-view="tour" data-i18n="tab_tour"></button>
    <button class="tab" data-view="wheel" data-i18n="tab_wheel"></button>
    <button class="tab" data-view="case" data-i18n="tab_case"></button>
  </div>
  <div class="tools">
    <label class="grid-opt"><span data-i18n="size"></span> <input type="range" id="size" min="50" max="260" step="5"></label>
    <label class="grid-opt"><span data-i18n="shape"></span>
      <select id="aspect">
        <option value="portrait" data-i18n="shape_portrait"></option>
        <option value="square" data-i18n="shape_square"></option>
        <option value="wide" data-i18n="shape_wide"></option>
      </select>
    </label>
    <label class="grid-opt"><input type="checkbox" id="captions"> <span data-i18n="captions"></span></label>
    <label class="grid-opt" data-i18n-title="zoom_tip"><input type="checkbox" id="zoomOpt"> <span data-i18n="zoom_opt"></span></label>
    <span class="spacer"></span>
    <span class="tier-only undo-btns">
      <button class="btn icon-btn" id="undoTier" data-i18n-title="undo_tip">↶</button>
      <button class="btn icon-btn" id="redoTier" data-i18n-title="redo_tip">↷</button>
    </span>
    <label class="tier-only"><span data-i18n="bg"></span> <input type="color" id="bg"></label>
    <button class="btn icon-btn tier-only" id="bgReset" data-i18n-title="bg_reset" hidden>↺</button>
    <button class="btn tier-only" id="presentBtn" data-i18n="present"></button>
    <button class="btn tier-only" id="revealBtn" data-i18n="reveal_btn" data-i18n-title="reveal_tip"></button>
    <button class="btn tier-only danger" id="resetBtn" data-i18n="reset"></button>
    <button class="btn primary tier-only" id="pngBtn" data-i18n="png"></button>
    <button class="btn icon-btn" id="helpBtn" data-i18n-title="help_tip">?</button>
    <label class="lang-pick" data-i18n-title="lang">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
      <select id="lang"></select>
    </label>
    <a class="gh" id="ghLink" target="_blank" rel="noopener" hidden title="GitHub">
      <svg viewBox="0 0 16 16" width="22" height="22" fill="#fff"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </div>
</header>

<!-- ============ TIER LIST ============ -->
<section class="view" id="view-tier">
  <div class="tiers-scroll scroll" id="tiersScroll">
    <div id="tiers"></div>
    <button class="btn add-row" id="addRow" data-i18n="add_row"></button>
  </div>
  <div class="splitter" id="splitter" data-i18n-title="resize"></div>
  <div class="pool-panel">
    <div class="pool-head">
      <h3><span data-i18n="unranked"></span> <span class="muted" id="poolCount">0</span></h3>
      <input type="text" id="search" data-i18n-ph="search" style="width:180px">
      <select id="sortSel">
        <option value="" data-i18n="sort_ph"></option>
        <option value="name" data-i18n="sort_az"></option>
        <option value="rating" data-i18n="sort_rating"></option>
        <option value="new" data-i18n="sort_new"></option>
        <option value="old" data-i18n="sort_old"></option>
        <option value="shuffle" data-i18n="shuffle"></option>
      </select>
      <span class="spacer"></span>
      <button class="btn primary" id="addFilesBtn" data-i18n="add_files"></button>
      <button class="btn primary" id="addDirBtn" data-i18n="add_folder"></button>
      <button class="btn danger" id="wipeBtn" data-i18n="wipe"></button>
      <input type="file" id="fFiles" multiple accept="image/*" hidden>
      <input type="file" id="fDir" webkitdirectory multiple hidden>
    </div>
    <div class="hint" data-i18n-html="hint"></div>
    <div id="pool" class="scroll" data-list="pool"></div>
  </div>
</section>

<!-- ============ COMPARE ============ -->
<section class="view" id="view-cmp">
  <div class="bar">
    <span class="muted" data-i18n="cmp_in"></span>
    <div class="scope" id="scope"></div>
    <label><span data-i18n="top_only"></span> <input type="number" id="topN" min="0" step="5" style="width:70px"> <span class="muted" data-i18n="top_hint"></span></label>
    <span class="spacer"></span>
    <button class="btn" id="undoBtn" data-i18n="undo"></button>
    <button class="btn danger" id="resetElo" data-i18n="reset_elo"></button>
  </div>
  <div class="progress">
    <div class="stats" id="stats"></div>
    <div class="pbar"><div id="pfill"></div></div>
  </div>
  <div class="cmp-body">
  <div class="arena" id="arena">
    <div class="card" data-side="0"><img alt="" draggable="false"><div class="nm"></div></div>
    <div class="mid">
      <div class="vs">VS</div>
      <button class="btn" id="drawBtn" data-i18n="same"></button>
      <button class="btn" id="skipBtn" data-i18n="skip"></button>
    </div>
    <div class="card" data-side="1"><img alt="" draggable="false"><div class="nm"></div></div>
  </div>
  <div class="arena-empty" id="arenaEmpty" data-i18n="need2"></div>
  <aside class="cmp-top" id="cmpTop"></aside>
  </div>
  <div class="keys" data-i18n="keys"></div>
</section>

<!-- ============ RESULTS ============ -->
<section class="view" id="view-res">
  <div class="bar">
    <span id="resInfo" class="muted"></span>
    <label><input type="checkbox" id="showUnrated" checked> <span data-i18n="show_unrated"></span></label>
    <span class="spacer"></span>
    <button class="btn" id="autoTier" data-i18n="auto_btn"></button>
    <button class="btn primary" id="resPng" data-i18n="png"></button>
  </div>
  <div class="grid scroll" id="grid"></div>
</section>

<!-- ============ TOURNAMENT ============ -->
<section class="view" id="view-tour">
  <div class="bar">
    <span class="muted" data-i18n="cmp_in"></span>
    <div class="scope" id="tourScope"></div>
    <label><span data-i18n="tour_size"></span> <select id="tourSize"></select></label>
    <label><span data-i18n="tour_seed"></span>
      <select id="tourSeed"><option value="rating" data-i18n="tour_seed_rating"></option><option value="rand" data-i18n="tour_seed_rand"></option></select>
    </label>
    <label><input type="checkbox" id="tourElo"> <span data-i18n="tour_elo"></span></label>
    <span class="spacer"></span>
    <button class="btn" id="tourUndo" data-i18n="undo"></button>
    <button class="btn primary" id="tourStart" data-i18n="tour_start"></button>
  </div>
  <div class="tour-stage" id="tourStage"></div>
  <div class="tour-bracket scroll" id="tourBracket"></div>
  <div class="keys" data-i18n="tour_keys"></div>
</section>

<!-- ============ WHEEL OF FORTUNE ============ -->
<section class="view spin-view" id="view-wheel">
  <div class="spin-main">
    <div class="bar">
      <label class="dur"><span data-i18n="sp_dur"></span> <input type="range" class="sdur" min="1" max="30" step="0.5"> <b class="sdur-v"></b></label>
      <label><input type="checkbox" class="ssound"> <span data-i18n="sp_sound"></span></label>
      <label><input type="checkbox" id="wheelRemove"> <span data-i18n="sp_remove_win"></span></label>
      <span class="spacer"></span>
      <button class="btn primary" id="wheelSpin" data-i18n="sp_spin"></button>
    </div>
    <div class="wheel-area" id="wheelArea">
      <div class="wheel-box" id="wheelBox">
        <canvas id="wheelCv"></canvas>
        <div class="wheel-pointer"></div>
        <button class="wheel-hub" id="wheelHub" data-i18n="sp_spin"></button>
      </div>
    </div>
    <div class="keys" data-i18n="sp_keys_wheel"></div>
  </div>
  <aside class="spin-side"></aside>
</section>

<!-- ============ CASE OPENING ============ -->
<section class="view spin-view" id="view-case">
  <div class="spin-main">
    <div class="bar">
      <label class="dur"><span data-i18n="sp_dur"></span> <input type="range" class="sdur" min="1" max="30" step="0.5"> <b class="sdur-v"></b></label>
      <label><input type="checkbox" class="ssound"> <span data-i18n="sp_sound"></span></label>
      <span class="spacer"></span>
      <span class="asset"><button class="btn" id="caseBg" data-i18n="sp_bg"></button><button class="btn icon-btn" id="caseBgOff" data-i18n-title="sp_bg_off" hidden>✕</button></span>
      <span class="asset"><button class="btn" id="caseSnd" data-i18n="sp_snd"></button><button class="btn icon-btn" id="caseSndOff" data-i18n-title="sp_snd_off" hidden>✕</button></span>
      <input type="file" id="fCaseBg" accept="image/*" hidden>
      <input type="file" id="fCaseSnd" accept="audio/*,.mp3,.ogg,.wav,.m4a" hidden>
      <button class="btn" id="caseCs" data-i18n="sp_cs_odds" data-i18n-title="sp_cs_tip"></button>
    </div>
    <div class="case-area">
      <div class="case-window" id="caseWin">
        <div class="case-strip" id="caseStrip"></div>
        <div class="case-marker"></div>
        <div class="case-empty" id="caseEmpty" data-i18n="sp_wheel_empty" hidden></div>
      </div>
      <button class="btn open-case" id="caseOpen" data-i18n="sp_open"></button>
    </div>
    <div class="keys" data-i18n="sp_keys_case"></div>
  </div>
  <aside class="spin-side"></aside>
</section>

<button class="btn" id="exitPresent" data-i18n="exit_present"></button>

<div id="selBar" hidden>
  <span id="selCount"></span>
  <div id="selTiers"></div>
  <button class="btn icon-btn" id="selCard" data-i18n-title="card_open">✎</button>
  <button class="btn icon-btn" id="selPool">↩</button>
  <button class="btn icon-btn danger" id="selDel">🗑</button>
  <button class="btn icon-btn" id="selClear">✕</button>
</div>

<div class="modal-bg" id="dlg">
  <div class="dlg">
    <h3 id="dlgTitle"></h3>
    <div id="dlgBody"></div>
    <div class="dlg-btns">
      <button class="btn" id="dlgCancel"></button>
      <button class="btn primary" id="dlgOk"></button>
    </div>
  </div>
</div>

<div class="modal-bg" id="tierModal">
  <div class="modal">
    <button class="x" id="mClose" data-i18n-title="close">×</button>
    <div class="colors" id="mColors"></div>
    <textarea id="mLabel" rows="2"></textarea>
    <div class="mbtns">
      <button id="mDel" data-i18n="m_delete"></button>
      <button id="mClear" data-i18n="m_clear"></button>
      <button id="mAbove" data-i18n="m_above"></button>
      <button id="mBelow" data-i18n="m_below"></button>
    </div>
  </div>
</div>
<div class="modal-bg" id="winModal">
  <div class="win" id="winCard">
    <div class="win-title" data-i18n="sp_win"></div>
    <div class="win-body" id="winBody"></div>
    <div class="win-btns">
      <button class="btn" id="winExclude" data-i18n="sp_exclude"></button>
      <button class="btn primary" id="winOk">OK</button>
    </div>
  </div>
</div>
<canvas id="fx"></canvas>
<div id="zoom" hidden><img alt=""><div class="zoom-name"></div><div class="zoom-note"></div></div>
<div id="toast"><span id="toastMsg"></span><button class="btn" id="toastAct" hidden></button></div>

<script src="i18n.js"></script>
<script src="spin.js"></script>
<script src="tour.js"></script>
<script src="app.js"></script>
</body>
</html>
